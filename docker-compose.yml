# docker-compose.yml for FHIRant Server
#
#   cd fhirant && docker compose up --build
#
# The context is this repository. It used to be the parent directory, for a
# path dependency on cicada that is a git dependency now.

services:
  fhirant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - fhirant-data:/data
    environment:
      - FHIRANT_ENCRYPTION_KEY=${FHIRANT_ENCRYPTION_KEY:-change-me-in-production}
      - FHIRANT_JWT_SECRET=${FHIRANT_JWT_SECRET:-change-me-in-production}

volumes:
  fhirant-data:
