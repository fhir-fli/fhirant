name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Coverage only. Sunday 04:00 UTC; the `coverage` job below says why it is
  # not on every push.
  schedule:
    - cron: '0 4 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # One checkout is enough now. fhirant_server used to depend on cicada by
      # a path leaving this repo, which forced a second checkout beside it and
      # this repo into a subdirectory; cicada is a git dependency instead, so
      # `pub get` fetches it at the commit the lock file names.
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      # Every package is checked even when an earlier one fails. Aborting on
      # the first failure hides every package after it alphabetically, which is
      # how the fhir family shipped a 0.8.0 regression: the failure was in a
      # package that sorts before the one whose tests mattered.
      - name: Format, analyze and test each package
        run: |
          failed=""
          for d in packages/*/; do
            [ -f "${d}pubspec.yaml" ] || continue
            pkg=$(basename "$d")

            # Flutter packages must use the flutter tool; the pure Dart ones
            # (fhirant_db, fhirant_logging, fhirant_server) must not, because
            # `flutter test` cannot run a package with no flutter_test dep.
            if grep -qE '^[[:space:]]+sdk:[[:space:]]*flutter[[:space:]]*$' "${d}pubspec.yaml"; then
              tool=flutter
            else
              tool=dart
            fi

            echo "::group::$pkg ($tool)"
            (
              set -e
              cd "$d"
              $tool pub get
              for f in lib test bin tool; do
                if [ -d "$f" ]; then
                  dart format --output=none --set-exit-if-changed "$f"
                fi
              done
              $tool analyze
              # Every package has tests now. The guard stays so that a package
              # added later without them does not fail the job for that alone.
              if [ -d test ]; then $tool test; fi
            )
            if [ $? -ne 0 ]; then
              failed="${failed} ${pkg}"
              echo "::error::${pkg} failed"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing packages:${failed}"
            exit 1
          fi
          echo "All packages passed"

  # Coverage is its own job, it does NOT gate anything, and it runs WEEKLY or
  # on demand rather than on every push. That is a measured choice, made on
  # this machine on 2026-08-30:
  #
  #   fhirant_server, 775 tests, no coverage                   35 seconds
  #   the same suite, `dart test --coverage`, default parallel WEDGED: stuck
  #     at test 193 for 6 minutes at 90% CPU and 2.7 GB, killed
  #   the same suite, `--coverage --concurrency=1`             16m59s, 775/775
  #
  # So coverage costs about 29x the run time and only completes serially. That
  # is worth paying weekly for a number that moves slowly; it is not worth
  # paying on every commit, and it must never sit in front of a merge. There
  # is deliberately no threshold: a percentage is reported, not enforced.
  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Flutter packages write coverage/lcov.info themselves. The pure Dart
      # ones write a directory of JSON that format_coverage turns into lcov,
      # which is what this provides.
      - name: Install the coverage tool
        run: dart pub global activate coverage

      - name: Measure line coverage per package
        run: |
          echo "| Package | Lines covered | % |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for d in packages/*/; do
            [ -f "${d}pubspec.yaml" ] || continue
            [ -d "${d}test" ] || continue
            pkg=$(basename "$d")
            if grep -qE '^[[:space:]]+sdk:[[:space:]]*flutter[[:space:]]*$' "${d}pubspec.yaml"; then
              tool=flutter
            else
              tool=dart
            fi

            echo "::group::$pkg"
            (
              cd "$d"
              $tool pub get
              if [ "$tool" = flutter ]; then
                flutter test --coverage
              else
                # --concurrency=1 is not tuning. With the default, collecting
                # coverage over fhirant_server wedges: 90% CPU, 2.7 GB, no
                # progress past test 193 of 775.
                dart test --coverage=coverage --concurrency=1
                dart pub global run coverage:format_coverage \
                  --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
              fi
            )
            echo "::endgroup::"

            lcov="${d}coverage/lcov.info"
            if [ -f "$lcov" ]; then
              awk -F: -v pkg="$pkg" '
                /^LF:/ { found += $2 }
                /^LH:/ { hit += $2 }
                END {
                  pct = found ? 100 * hit / found : 0
                  printf "| %s | %d/%d | %.1f%% |\n", pkg, hit, found, pct
                }' "$lcov" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $pkg | no lcov produced | — |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: packages/*/coverage/lcov.info
          if-no-files-found: warn
