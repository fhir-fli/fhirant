include: package:very_good_analysis/analysis_options.yaml
analyzer:
  # Strict typing: an implicit downcast, an uninferred type or a raw generic
  # is an error, not a silent `dynamic`. Turned on 2026-09-22 after an audit
  # of the server found 209 uses of dynamic and 104 `!`; the flags found no
  # new issue in any package on that day, so they cost nothing and catch
  # the next one.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_positional_boolean_parameters: ignore
    always_put_required_named_parameters_first: ignore
    document_ignores: ignore
    comment_references: ignore
    avoid_catches_without_on_clauses: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    # fhirant is an application, not a published library — its packages have no
    # public API surface for consumers, so member-level API docs aren't apt.
    public_member_api_docs: false
