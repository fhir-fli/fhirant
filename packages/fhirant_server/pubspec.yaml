name: fhirant_server
description: A standalone server for standalone use with the FhirAntDb or in combination with the FhirAnt Flutter Interface.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  args: ^2.7.0
  # cicada is a separate repository, so this is a git dependency rather than a
  # path that leaves this one. With the path, a clone of fhirant alone could
  # not resolve, build or test, and CI had to check this repo out into a
  # subdirectory with cicada beside it to reproduce the local layout.
  # To work on cicada and fhirant together, put a pubspec_overrides.yaml here
  # pointing at your own checkout; it is gitignored.
  cicada:
    git:
      url: https://github.com/fhir-fli/cicada.git
      path: cicada
      ref: main
  cql: ^0.6.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.3.1
  drift: ^2.29.0
  fhir_r4: ^0.12.0
  fhir_r4_bulk: ^0.12.0
  fhir_r4_cql: ^0.12.0
  fhir_r4_mapping: ^0.12.0
  fhir_r4_path: ^0.12.0
  fhir_r4_validation: ^0.12.0
  fhirant_db:
    path: ../fhirant_db
  fhirant_logging:
    path: ../fhirant_logging
  http: ^1.6.0
  # AES-GCM for the passphrase-wrapped backup envelope. Pure Dart, so the
  # export behaves the same on-device and headless.
  meta: ^1.15.0
  pointycastle: ^4.0.0
  shelf: ^1.4.2
  shelf_rate_limiter: ^1.0.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.1.5
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3
  yaml: ^3.1.3

# fhirant is developed against the fhir_r4 family's dev branch, which is
# ahead of the published 0.12.0 (fhir_r4_db schema 9-12, HistoryEntry,
# CompartmentScope, the Bulk Data models). Local checkouts keep winning
# through the gitignored pubspec_overrides.yaml, which replaces this whole
# section; a clean clone, CI included, resolves the same code from git.
# Remove this section at the next family release.
# Each git override is pinned to a COMMIT, not a branch: a branch made
# every clean build (the image, CI) take whatever the branch held that
# minute, and the lock cannot pin it while a local pubspec_overrides.yaml
# writes this machine's paths into it (REVIEW-2026-09-17 S8). Move a pin
# on purpose, in its own commit.
dependency_overrides:
  # The model-independent store fhir_r4_db binds (fhir_db 0.13.0), from its
  # repository until it is on pub.dev; remove with this section.
  fhir_db:
    git:
      url: https://github.com/fhir-fli/fhir_db.git
      ref: de0d3b838c4513b5086c223413cb62831ddbe736  # main on 2026-09-19
  # fhir_path 0.14.2: resolve() on a literal reference, which uploaded
  # SearchParameters index by; until it is on pub.dev.
  fhir_path:
    git:
      url: https://github.com/fhir-fli/fhir_path.git
      ref: d9b201eb15e1c3385765085667d4d8987fcf6a4f  # main on 2026-09-19
  fhir_r4:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: 1e7ddbf07535dfe566f265a886ff517093371150  # dev on 2026-09-19
      path: packages/fhir_r4
  fhir_r4_bulk:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: 1e7ddbf07535dfe566f265a886ff517093371150  # dev on 2026-09-19
      path: packages/fhir_r4_bulk
  fhir_r4_db:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: 1e7ddbf07535dfe566f265a886ff517093371150  # dev on 2026-09-19
      path: packages/fhir_r4_db

dev_dependencies:
  logging: ^1.3.0
  mocktail: ^1.0.0
  test: ^1.25.8
  very_good_analysis: ^10.0.0

# Build SQLite from the sqlite3mc source (SQLite3 Multiple Ciphers) so the
# database supports SQLCipher-compatible encryption without a separately
# shipped libsqlcipher (see bin/server.dart cipher PRAGMAs).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
