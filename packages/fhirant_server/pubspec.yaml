name: fhirant_server
description: A standalone server for standalone use with the FhirAntDb or in combination with the FhirAnt Flutter Interface.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  args: ^2.7.0
  cicada:
    path: ../../../cicada/cicada
  drift: ^2.29.0
  fhir_r4: ^0.7.0
  fhir_r4_cql: ^0.7.0
  cql: ^0.6.3
  fhir_r4_path: ^0.7.0
  fhir_r4_mapping: ^0.7.0
  fhir_r4_validation: ^0.7.0
  fhirant_db:
    path: ../fhirant_db
  fhirant_logging:
    path: ../fhirant_logging
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.3.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_rate_limiter: ^1.0.1
  sqlite3: ^3.1.5
  uuid: ^4.5.1

  http: any
dev_dependencies:
  test: ^1.25.8
  mocktail: ^1.0.0
  very_good_analysis: ^10.0.0

# Build SQLite from the sqlite3mc source (SQLite3 Multiple Ciphers) so the
# database supports SQLCipher-compatible encryption without a separately
# shipped libsqlcipher (see bin/server.dart cipher PRAGMAs).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
