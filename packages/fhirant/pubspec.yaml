name: fhirant
description: FHIR ANT — a FHIR R4 server in your pocket.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  fhir_r4: ^0.12.0
  fhirant_db:
    path: ../fhirant_db
  fhirant_logging:
    path: ../fhirant_logging
  fhirant_secure_storage:
    path: ../fhirant_secure_storage
  fhirant_server:
    path: ../fhirant_server
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.13.4
  flutter_secure_storage: ^10.0.0
  network_info_plus: ^6.1.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.0
  sqlite3: ^3.1.5
  url_launcher: ^6.3.1

# fhirant is developed against the fhir_r4 family's dev branch, which is
# ahead of the published 0.12.0 (fhir_r4_db schema 9-12, HistoryEntry,
# CompartmentScope, the Bulk Data models). Local checkouts keep winning
# through the gitignored pubspec_overrides.yaml, which replaces this whole
# section; a clean clone, CI included, resolves the same code from git.
# Remove this section at the next family release.
dependency_overrides:
  # The model-independent store fhir_r4_db binds (fhir_db 0.13.0), from its
  # repository until it is on pub.dev; remove with this section.
  fhir_db:
    git:
      url: https://github.com/fhir-fli/fhir_db.git
      ref: main
  fhir_r4:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: dev
      path: packages/fhir_r4
  fhir_r4_bulk:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: dev
      path: packages/fhir_r4_bulk
  fhir_r4_db:
    git:
      url: https://github.com/fhir-fli/fhir_r4.git
      ref: dev
      path: packages/fhir_r4_db

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/
    # The R4B specification's canonical resources (StructureDefinitions,
    # ValueSets, CodeSystems, ...), the same NDJSON set the CLI loads, loaded
    # into the store on first boot so $validate can resolve them on the
    # phone (REVIEW-2026-09-06 finding 43). A symlink to the server
    # package's copy, so there is one set.
    - assets/fhir_spec/
