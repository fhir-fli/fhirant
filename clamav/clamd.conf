# clamd settings for the clamav service in docker-compose.yml, mounted over
# the image's /etc/clamav/clamd.conf (ClamAV Docker docs: config files "can
# be overridden by doing a volume-mount to the specific file").
#
# The first five lines are the image's own settings (clamav/clamav:1.5.4,
# read from the image 2026-10-21); everything else there is ClamAV's
# default.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# fhirant's one change. ClamAV's clamd.conf.sample: "When AlertExceedsMax is
# set, files exceeding the MaxFileSize, MaxScanSize, or MaxRecursion limit
# will be flagged with the virus name starting with
# "Heuristics.Limits.Exceeded". Default: no". Without it, a scan cut short
# by a limit reports the file clean.
#
# What it does not cover, in 1.5.4: a zip member longer than MaxFileSize
# (100M) is scanned up to 100M and the rest dropped with no alert
# (libclamav/unzip.c, "trimming output size to maxfilesize"; measured, a zip
# of 150 MiB of zeros came back clean,
# packages/fhirant_server/tool/review_2026-10-17/clamd/scan_timing.tsv).
AlertExceedsMax yes
